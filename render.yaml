# Render Blueprint: one click creates the web service (API + React app in one) and a free PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository. Secrets are NOT stored here: Render asks you for every
# value marked `sync: false` and keeps them in its dashboard (never in git).
databases:
  - name: leadflow-db
    plan: free
    databaseName: leadflow
    user: leadflow

services:
  - type: web
    name: leadflow-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadflow-db
          property: connectionString
      - key: ENVIRONMENT
        value: production          # refuses to start with a weak JWT secret
      - key: JWT_SECRET
        generateValue: true        # Render generates a strong random value
      # first admin account, created automatically on first start
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # AI providers (free tiers): add at least one key
      - key: AI_PRIMARY_PROVIDER
        value: groq
      - key: AI_FALLBACK_PROVIDER
        value: gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # email (optional): leave blank to keep email features off
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
